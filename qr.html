<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlocNav SAR Demo</title>

    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Source Sans 3', sans-serif;
            background: #f5f6f8;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 420px;
        }

        .logo img {
            height: 60px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        p {
            color: #445062;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .qr {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

            .qr img {
                width: 260px;
                height: 260px;
            }

        .url {
            margin-top: 16px;
            font-size: 14px;
            color: #2358e8;
            font-weight: 600;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #8e99ab;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            <img src="https://blocnav.com/assets/blocnavbrand2.png" alt="BlocNav">
        </div>

        <h1>Scan to try BlocNav</h1>

        <p>
            Search & Rescue field demo<br>
            Works even when signal doesn’t
        </p>

        <div class="qr">
            <img src="assets/qr.png" alt="BlocNav QR Code">
        </div>

        <div class="url">
            blocnav.com/mocsar
        </div>

        <div class="footer">
            No app install required
        </div>

    </div>

</body>
</html>
